[package]
name = "koharu"
default-run = "koharu"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tauri's bundler resolves CEF from app-level features; workspace inheritance alone
# compiles CEF but leaves its runtime files out of Windows installers.
default = ["tauri/cef"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
dirs = { workspace = true }
koharu-app = { workspace = true }
koharu-desktop = { workspace = true }
koharu-runtime = { workspace = true }
koharu-torch = { workspace = true }
koharu-torch-sys = { workspace = true }
rfd = { workspace = true }
sentry = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
