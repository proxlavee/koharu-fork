name: llama.cpp

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: ['main']
    paths:
      - '.github/llama.cpp/**'
      - '.github/workflows/llama-cpp.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.github/llama.cpp/**'
      - '.github/workflows/llama-cpp.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve latest release
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve latest llama.cpp release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.backend }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(github.event_name == 'pull_request' && '["vulkan"]' || '["cuda", "hip", "vulkan"]') }}
        os: [windows-2022]

    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
      REF: ${{ needs.source.outputs.tag }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Cache compilation
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: ${{ github.workflow }}-${{ runner.os }}-${{ matrix.backend }}
          variant: sccache
          max-size: 2G

      - name: Clone llama.cpp
        shell: bash
        run: |
          git clone --depth 1 --branch "$REF" \
            https://github.com/ggml-org/llama.cpp upstream/llama.cpp
          commit=$(git -C upstream/llama.cpp rev-parse HEAD)
          printf 'llama.cpp commit: %s\n' "$commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Install CUDA 13.0
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: network
          sub-packages: >-
            ["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas",
            "cublas_dev"]

      - name: Set up Python for ROCm
        if: matrix.backend == 'hip'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ROCm 7.14
        if: matrix.backend == 'hip'
        shell: bash
        run: |
          python -m pip install \
            --index-url https://repo.amd.com/rocm/whl-multi-arch/ \
            "rocm[libraries,devel]==7.14.0"
          rocm-sdk init

          rocm_root=$(cygpath -w "$(rocm-sdk path --root)")
          rocm_bin="$rocm_root\\bin"
          llvm_root="$rocm_root\\lib\\llvm"
          llvm_bin="$llvm_root\\bin"
          device_lib="$llvm_root\\amdgcn\\bitcode"
          {
            printf 'ROCM_PATH=%s\n' "$rocm_root"
            printf 'HIP_PATH=%s\n' "$rocm_root"
            printf 'HIP_PLATFORM=amd\n'
            printf 'HIP_DEVICE_LIB_PATH=%s\n' "$device_lib"
            printf 'LLVM_PATH=%s\n' "$llvm_root"
          } >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$rocm_bin" "$llvm_bin" >> "$GITHUB_PATH"

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: bash
        run: |
          version=1.4.313.2
          installer="$(cygpath -u "$RUNNER_TEMP")/VulkanSDK-Installer.exe"
          curl.exe -o "$installer" -L \
            "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          "$installer" --accept-licenses --default-answer --confirm-command install
          printf 'VULKAN_SDK=C:\\VulkanSDK\\%s\n' "$version" >> "$GITHUB_ENV"
          printf 'C:\\VulkanSDK\\%s\\bin\n' "$version" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          generator=()
          backend_args=()

          case "$BACKEND" in
            cuda)
              generator=(-G Ninja)
              backend_args+=("-DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;100-real;120")
              ;;
            hip)
              generator=(-G Ninja)
              backend_args+=(
                "-DCMAKE_C_COMPILER=clang.exe"
                "-DCMAKE_CXX_COMPILER=clang++.exe"
                "-DGPU_TARGETS=gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201;gfx908;gfx90a"
              )
              ;;
            vulkan)
              generator=(-G Ninja)
              ;;
          esac

          cmake -S .github/llama.cpp -B build "${generator[@]}" \
            -DLLAMA_CPP_SOURCE_DIR="$PWD/upstream/llama.cpp" \
            -DLLAMA_BACKEND="$BACKEND" \
            -DCMAKE_BUILD_TYPE=Release \
            "${backend_args[@]}"

      - name: Build llama and MTMD
        shell: bash
        run: cmake --build build --target llama mtmd --config Release --parallel 4

      - name: Package llama and MTMD
        shell: bash
        run: |
          mkdir package
          cp build/bin/*llama.* package/
          cp build/bin/*mtmd.* package/
          tar -C package -czf "llama-$BACKEND-${{ matrix.os }}.tar.gz" .

      - name: Upload llama
        uses: actions/upload-artifact@v7
        with:
          name: llama-${{ matrix.backend }}-${{ matrix.os }}
          path: llama-${{ matrix.backend }}-${{ matrix.os }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.event_name != 'pull_request'
    needs: [source, build]
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download llama builds
        uses: actions/download-artifact@v7
        with:
          pattern: llama-*
          path: release
          merge-multiple: true

      - name: Publish llama release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: llama.cpp-${{ needs.source.outputs.tag }}
          target_commitish: ${{ github.event.repository.default_branch }}
          name: llama.cpp ${{ needs.source.outputs.tag }} (Windows)
          body: Windows runtime dependency for Koharu.
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: release/*.tar.gz
