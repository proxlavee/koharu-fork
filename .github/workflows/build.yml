name: Build

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app
          key: x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build Windows application
        run: bun run build
      - name: Build typesetting audit tool
        run: cargo build -p koharu-pipeline --bin typesetting-audit --release --locked
      - name: Upload Windows developer tools
        uses: actions/upload-artifact@v7
        with:
          name: koharu-windows-dev-tools
          path: |
            target/release/typesetting-audit.exe
            target/release/koharu-torch.dll
          if-no-files-found: error
          retention-days: 3
