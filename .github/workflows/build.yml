name: Build

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter @koharu/app build
      - name: Build desktop application
        run: cargo build -p koharu --release --locked --target x86_64-pc-windows-msvc
      - name: Bundle Windows installer
        run: >-
          cargo run -p koharu-bundle --locked --
          --package nsis
          --target x86_64-pc-windows-msvc
          --executable target/x86_64-pc-windows-msvc/release/koharu.exe
          --libraries target/release/koharu-torch.dll
          --ui packages/koharu/out
          --license LICENSE
          --output target/bundle/windows
          --version "0.0.${{ github.run_number }}"
      - name: Smoke-test installed Windows application
        shell: bash
        run: >-
          bash .github/scripts/windows-startup-smoke.sh
          "target/bundle/windows/bundle/nsis/Koharu_0.0.${{ github.run_number }}_x64-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: koharu-windows
          path: target/bundle/windows/bundle/nsis/*.exe
          retention-days: 3
