name: Build

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ensure-runtimes:
    name: Ensure Windows ML runtimes
    runs-on: windows-2022
    timeout-minutes: 245
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify or build pinned Windows runtimes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--dispatch-missing)
          fi
          bash .github/scripts/ensure-windows-runtimes.sh "${args[@]}"

  build:
    name: Windows
    needs: ensure-runtimes
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app
          key: x86_64-pc-windows-msvc
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v6
        with:
          path: packages/koharu/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/**/*.js', 'packages/**/*.jsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify Tauri CLI
        run: bun x tauri --version
      - name: Build unsigned Windows installer
        run: bun x tauri build --ci --no-sign --bundles nsis -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: koharu-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Smoke installed Windows application
    needs: build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Restore installed runtime smoke cache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/KoharuData/store
          key: windows-runtime-smoke-v1-${{ hashFiles('Cargo.lock', 'crates/koharu-runtime/**', 'crates/koharu-torch/**', 'crates/koharu-torch-sys/**') }}
          restore-keys: |
            windows-runtime-smoke-v1-
      - uses: actions/download-artifact@v8
        with:
          name: koharu-windows
          path: dist
      - name: Install and launch packaged application
        shell: bash
        run: |
          shopt -s nullglob
          installers=(dist/*-setup.exe)
          if (( ${#installers[@]} != 1 )); then
            printf 'Expected one NSIS installer, found %s\n' "${#installers[@]}" >&2
            exit 1
          fi
          bash .github/scripts/windows-startup-smoke.sh "${installers[0]}"
