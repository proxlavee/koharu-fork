name: Build

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Verify downloadable Windows ML runtimes
        shell: bash
        run: |
          base=https://github.com/proxlavee/koharu-fork/releases/download
          assets=(
            "$base/llama.cpp-b9982/llama-cuda-windows-2022.tar.gz"
            "$base/llama.cpp-b9982/llama-hip-windows-2022.tar.gz"
            "$base/llama.cpp-b9982/llama-vulkan-windows-2022.tar.gz"
            "$base/stable-diffusion.cpp-master-769-cc73429/stable-diffusion-cuda-windows-2022.tar.gz"
            "$base/stable-diffusion.cpp-master-769-cc73429/stable-diffusion-hip-windows-2022.tar.gz"
            "$base/stable-diffusion.cpp-master-769-cc73429/stable-diffusion-vulkan-windows-2022.tar.gz"
          )
          for asset in "${assets[@]}"; do
            curl.exe --fail --silent --show-error --location --head \
              --retry 4 --retry-all-errors "$asset" >/dev/null
          done
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build unsigned Windows installer
        run: cargo tauri build --ci --no-sign --bundles nsis -- --locked
      - name: Smoke-test installed Windows application
        shell: bash
        run: |
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          if (( ${#installers[@]} != 1 )); then
            printf 'Expected one NSIS installer, found %s\n' "${#installers[@]}" >&2
            exit 1
          fi
          bash .github/scripts/windows-startup-smoke.sh "${installers[0]}"
      - uses: actions/upload-artifact@v7
        with:
          name: koharu-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  publish-test:
    name: Publish Windows test prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: koharu-windows
          path: dist
      - name: Publish test prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Windows test build ${{ github.run_number }}
          body: |
            Automated unsigned Windows test build for `${{ github.sha }}`.

            The installer passed the Windows build and installed-application startup smoke test. It may trigger Microsoft Defender SmartScreen.
          files: dist/*-setup.exe
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
