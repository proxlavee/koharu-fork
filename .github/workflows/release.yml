name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and build Windows release
    runs-on: windows-2022
    outputs:
      app-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify or build pinned Windows runtimes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ensure-windows-runtimes.sh --dispatch-missing
      - uses: oven-sh/setup-bun@v2
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app
          key: x86_64-pc-windows-msvc
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v6
        with:
          path: packages/koharu/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('packages/**/*.js', 'packages/**/*.jsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify Tauri CLI
        run: bun x tauri --version
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must be MAJOR.MINOR.PATCH, got %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$version" != "$manifest_version" ]]; then
            printf 'Release tag version %s does not match Cargo workspace version %s\n' "$version" "$manifest_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Generate release notes
        shell: bash
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          previous=
          while IFS= read -r candidate; do
            if [[ "$candidate" != "$GITHUB_REF_NAME" ]]; then
              previous=$candidate
              break
            fi
          done < <(git tag --merged "$GITHUB_REF_NAME" --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)

          if [[ -n "$previous" ]]; then
            range="$previous..$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
          fi
          printf 'Generating release notes for %s\n' "$range"
          bun git-cliff --strip all "$range" > release-notes-full.md
          head -c 120000 release-notes-full.md > release-notes.md
          printf '\n\nThis Windows installer is unsigned and may trigger Microsoft Defender SmartScreen.\n' >> release-notes.md
      - name: Run Rust tests
        run: cargo test --workspace --tests --locked
      - name: Run UI tests
        run: bun run --filter @koharu/app test
      - name: Build unsigned Windows installer
        run: bun x tauri build --ci --no-sign --bundles nsis -- --locked
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: koharu-windows-release
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: koharu-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Smoke installed Windows release
    needs: build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Restore installed runtime smoke cache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/KoharuData/store
          key: windows-runtime-smoke-v1-${{ hashFiles('Cargo.lock', 'crates/koharu-runtime/**', 'crates/koharu-torch/**', 'crates/koharu-torch-sys/**') }}
          restore-keys: |
            windows-runtime-smoke-v1-
      - uses: actions/download-artifact@v8
        with:
          name: koharu-windows-release
          path: dist
      - name: Install and launch packaged application
        shell: bash
        run: |
          shopt -s nullglob
          installers=(dist/*-setup.exe)
          if (( ${#installers[@]} != 1 )); then
            printf 'Expected one NSIS installer, found %s\n' "${#installers[@]}" >&2
            exit 1
          fi
          bash .github/scripts/windows-startup-smoke.sh "${installers[0]}"

  publish:
    name: Publish versioned Windows release
    needs: [build, smoke]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: koharu-windows-release
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: koharu-release-notes
          path: release-meta
      - name: Publish Windows release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.build.outputs.app-version }}
          body_path: release-meta/release-notes.md
          files: dist/*-setup.exe
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
